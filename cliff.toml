[changelog]
header = """
# Changelog

Changes are grouped from the committed Git history.

"""
body = """
{% if version %}\n## {{ version | trim_start_matches(pat=\"v\") }} - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% else %}\n## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute=\"group\") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci|chore|refactor|perf|style)", group = "Maintenance" },
  { message = ".*", group = "Other changes" },
]
sort_commits = "oldest"
