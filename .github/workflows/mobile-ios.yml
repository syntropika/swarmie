name: Mobile iOS

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/ui/native/**"
      - "packages/config/**"
      - "sdk/react-native/**"
      - "sdk/wit/**"
      - "sdk/tools/build_apple.py"
      - "sdk/tools/build_mobile.py"
      - "crates/client*/**"
      - "fastlane/**"
      - "scripts/distribution/test_mobile_ios.rb"
      - "scripts/distribution/mobile_build.py"
      - "scripts/distribution/test_mobile_build.py"
      - "Gemfile"
      - "Gemfile.lock"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/actions/setup-xcode/**"
      - "mise.toml"
      - "justfile"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed development build to TestFlight
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-ios-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'development' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  COCOAPODS_DISABLE_STATS: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_DISABLE_COLORS: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  validate:
    name: Validate and export Expo
    runs-on: [self-hosted, linux, x64, docker]
    container: ruby:3.3.12-bookworm@sha256:b899e7de6ffa6e974d947202d3ce2ac921c12e46c14cff3106214079388dcff4
    timeout-minutes: 15
    outputs:
      rebuild: ${{ steps.plan.outputs.rebuild }}
      runtime: ${{ steps.plan.outputs.runtime }}
    env:
      APP_VARIANT: development
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_DEV_API_BASE_URL || (github.event_name == 'pull_request' && 'https://api.example.invalid') || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read root toolchain
        id: tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          for name, version in tomllib.loads(Path("mise.toml").read_text())["tools"].items():
              if name in ("ruby", "just", "node", "bun"):
                  print(f"{name}={version}")
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Verify Ruby and install locked gems
        env:
          EXPECTED_RUBY_VERSION: ${{ steps.tools.outputs.ruby }}
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          BUNDLE_FROZEN: "true"
        run: |
          test "$(ruby -e 'print RUBY_VERSION')" = "$EXPECTED_RUBY_VERSION"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          bundle install --jobs 4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: ${{ steps.tools.outputs.just }}
      - run: bun install --frozen-lockfile
      - run: just mobile-build-check
      - run: just mobile-check
      - name: Export the Expo application
        run: just mobile-export
      - name: Resolve the native runtime
        run: |
          mkdir -p dist/mobile
          just mobile-runtime ios > dist/mobile/runtime-ios.json
      - name: Compare with the last signed build
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/distribution/mobile_build.py plan --current dist/mobile/runtime-ios.json
      - name: Save the Expo export and runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-expo-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            apps/mobile/dist
            dist/mobile/runtime-ios.json
          retention-days: 7
          if-no-files-found: error

  build:
    name: Rebuild native development app
    if: needs.validate.outputs.rebuild == 'true' && (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch)
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, swarmie-macos]
    timeout-minutes: 90
    env:
      APP_VARIANT: development
      IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_DEV_API_BASE_URL || (github.event_name == 'pull_request' && 'https://api.example.invalid') || '' }}
      SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && 'signed' || 'unsigned' }}
      EXPECTED_RUNTIME_VERSION: ${{ needs.validate.outputs.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read root toolchain
        id: tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("mise.toml").read_text())
          for name in ("ruby", "just", "node", "bun", "rust"):
              print(f"{name}={config['tools'][name]}")
          PY
      - uses: ./.github/actions/setup-xcode
      - name: Validate the backend setting
        run: |
          set -euo pipefail
          test -n "$MOBILE_API_BASE_URL" || { echo 'Set MOBILE_DEV_API_BASE_URL before building.' >&2; exit 1; }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ steps.tools.outputs.ruby }}
          self-hosted: true
          bundler-cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: ${{ steps.tools.outputs.just }}
      - name: Install the pinned Rust toolchain
        env:
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: bun install --frozen-lockfile
      - name: Prepare readonly signing access
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MATCH_SSH_KEY" || { echo 'MATCH_SSH_PRIVATE_KEY is missing.' >&2; exit 1; }
          umask 077
          key_path="$RUNNER_TEMP/match-ssh-key"
          known_hosts="$RUNNER_TEMP/match-known-hosts"
          metadata_path="$RUNNER_TEMP/match-github-meta.json"
          printf '%s\n' "$MATCH_SSH_KEY" > "$key_path"
          ssh-keygen -y -f "$key_path" > /dev/null
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$metadata_path" https://api.github.com/meta
          python3 - "$metadata_path" > "$known_hosts" <<'PY'
          import json
          import sys
          from pathlib import Path
          keys = json.loads(Path(sys.argv[1]).read_text())["ssh_keys"]
          if not keys:
              sys.exit("GitHub metadata did not contain SSH host keys.")
          print("\n".join("github.com " + key for key in keys))
          PY
          {
            echo "MATCH_GIT_PRIVATE_KEY=$key_path"
            echo "GIT_SSH_COMMAND=ssh -F /dev/null -i $key_path -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          } >> "$GITHUB_ENV"
      - name: Prepare native SDK, Expo project and CocoaPods
        run: just mobile-ios-prepare
      - name: Archive the development app
        id: archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH || 'main' }}
          MATCH_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.MATCH_PASSWORD || '' }}
        run: |
          just mobile-ios-build "$SIGNING_MODE"
          app="dist/mobile/ios/Swarmie.xcarchive/Products/Applications/Swarmie.app"
          test -s "$app/main.jsbundle"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = 'app.swarmie.mobile.dev'
          test "$(plutil -extract EXUpdatesEnabled raw -o - "$app/Expo.plist")" = 'true'
          test "$(plutil -extract EXUpdatesRequestHeaders.expo-channel-name raw -o - "$app/Expo.plist")" = 'development'
      - name: Record the signed binary runtime
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/distribution/mobile_build.py record --ipa dist/mobile/ios/swarmie.ipa --output dist/mobile/ios/native-build.json
      - name: Upload to TestFlight
        id: upload
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          ASC_SIGNING_API_KEY_ID: ${{ secrets.ASC_SIGNING_API_KEY_ID }}
          ASC_SIGNING_API_ISSUER_ID: ${{ secrets.ASC_SIGNING_API_ISSUER_ID }}
          ASC_SIGNING_API_KEY_P8: ${{ secrets.ASC_SIGNING_API_KEY_P8 }}
        run: just mobile-ios-upload
      - name: Save the uploaded native runtime baseline
        if: github.event_name == 'workflow_dispatch' && inputs.upload && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-development-native-baseline
          path: dist/mobile/ios/native-build.json
          retention-days: 90
          if-no-files-found: error
      - name: Save the signed build and symbols
        if: always() && github.event_name == 'workflow_dispatch' && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-development-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/mobile/ios/*.ipa
            dist/mobile/ios/*.dSYM.zip
            dist/mobile/ios/expo-config.json
          retention-days: 14
          if-no-files-found: error
      - name: Save Xcode build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/mobile/ios/logs
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/match-ssh-key" "$RUNNER_TEMP/match-known-hosts" "$RUNNER_TEMP/match-github-meta.json"
