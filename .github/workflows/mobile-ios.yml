name: Mobile UI validation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/ui/native/**"
      - "packages/config/**"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "mise.toml"
      - "justfile"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  validate:
    name: Validate and export retained Mobile UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run check:mobile
      - name: Export UI without claiming native runtime qualification
        run: bun run build:mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-ui-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/mobile/dist
          retention-days: 7
          if-no-files-found: error
