name: Shared frontend

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.select.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        name: Select complete verification families
        run: python3 tools/quality/plan.py --output "$RUNNER_TEMP/selection.json" --github-output "$GITHUB_OUTPUT"
  verify:
    needs: plan
    if: always()
    env:
      SELECTED: ${{ needs.plan.outputs.selected }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a valid verification plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Record family selection
        run: echo "Selected verification family = $SELECTED"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.SELECTED == 'true'
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.SELECTED == 'true'
        with:
          node-version: "24.14.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.SELECTED == 'true'
        with:
          bun-version: "1.4.3"
      - name: Install locked dependencies
        if: env.SELECTED == 'true'
        run: bun install --frozen-lockfile
      - name: Install pinned Rust for canonical contract exports
        if: env.SELECTED == 'true'
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build pinned Tembra SDK dependency
        if: env.SELECTED == 'true'
        run: |
          python3 scripts/tembra/tooling.py bootstrap
          python3 scripts/tembra/tooling.py project-sdk
          python3 scripts/tembra/tooling.py verify-sdk
      - name: Verify shared policy and TypeScript contracts
        if: env.SELECTED == 'true'
        run: |
          bun run check:ui
          bun run typecheck
          bun run lint
          python3 tools/quality/evidence.py --output "$RUNNER_TEMP/evidence/frontend-tests" --tool bun --criterion integration.frontend-tests -- bun run test
      - name: Verify and bundle mobile client
        if: env.SELECTED == 'true'
        run: |
          bun run check:mobile
          bun run build:mobile
      - name: Build application frontends
        if: env.SELECTED == 'true'
        run: |
          bun run build:web
      - name: Build Storybook
        if: env.SELECTED == 'true'
        run: bun run build:storybook
      - name: Retain executed verification evidence
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-ui-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
