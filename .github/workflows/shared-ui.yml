name: Shared frontend

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/docs/**"
      - "sdk/react-native/**"
      - "packages/config/**"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "tsconfig.json"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/shared-ui.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/docs/**"
      - "sdk/react-native/**"
      - "packages/config/**"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "tsconfig.json"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/shared-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, docker]
    container: rust:1.94.0-bookworm@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify shared policy and TypeScript contracts
        run: |
          bun run check:ui
          bun run lint
          bun run typecheck
          bun run test
      - name: Verify and bundle mobile client
        run: |
          bun run check:mobile
          bun run build:mobile
      - name: Build application frontends
        run: |
          bun run --cwd apps/desktop build:web
          bun run --cwd apps/desktop build:demo
          bun run build:web
          bun run --cwd apps/docs build
      - name: Build Storybook
        run: bun run build:storybook
