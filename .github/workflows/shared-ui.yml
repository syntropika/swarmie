name: Shared frontend

on:
  pull_request:
    paths:
      - "packages/config/**"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/shared-ui.yml"
  push:
    branches: [main]
    paths:
      - "packages/config/**"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/shared-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify shared policy and TypeScript contracts
        run: |
          bun run check:ui
          bun run typecheck
          bun run test
      - name: Build Storybook
        run: bun run build:storybook
