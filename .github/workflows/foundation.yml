name: Plugin foundation

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: plugin-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.select.outputs.foundation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        name: Select complete verification families
        run: python3 tools/quality/plan.py --output "$RUNNER_TEMP/selection.json" --github-output "$GITHUB_OUTPUT"
  verify:
    needs: plan
    if: always()
    env:
      SELECTED: ${{ needs.plan.outputs.selected }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a valid verification plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Record family selection
        run: echo "Selected verification family = $SELECTED"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.SELECTED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.SELECTED == 'true'
        with:
          node-version: "24.14.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.SELECTED == 'true'
        with:
          bun-version: "1.4.3"
      - name: Install pinned Rust and Just
        if: env.SELECTED == 'true'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          cargo +1.99.0 install just --version 1.58.0 --locked
      - name: Install locked workspace and source-built Tembra SDK
        if: env.SELECTED == 'true'
        run: |
          bun install --frozen-lockfile
          just tembra-sdk
      - name: Verify canonical contracts, packaging and actual native lifecycle
        if: env.SELECTED == 'true'
        run: python3 tools/quality/evidence.py --output "$RUNNER_TEMP/evidence/foundation" --tool cargo --tool rustc --tool bun --tool just --criterion integration.contracts-and-native-lifecycle -- just foundation-check
      - name: Verify root frontend policy and retained clients
        if: env.SELECTED == 'true'
        run: python3 tools/quality/evidence.py --output "$RUNNER_TEMP/evidence/frontend-policy" --tool bun --criterion integration.root-policy -- bun run check
      - name: Retain executed verification evidence
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

  exhaustive:
    needs: [plan, verify]
    if: always() && needs.verify.result == 'success' && needs.plan.outputs.selected == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install pinned Rust and Just
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          cargo +1.99.0 install just --version 1.58.0 --locked
      - name: Install locked workspace and source-built Tembra SDK
        run: |
          bun install --frozen-lockfile
          just tembra-sdk
      - name: Build the real browser ABI
        run: |
          just tembra-browser-tools
          just tembra-browser
      - name: Install the pinned acceptance browser
        run: |
          bun add --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Verify real Browser Host and React plugin lifecycle
        run: python3 tools/quality/evidence.py --output "$RUNNER_TEMP/evidence/browser" --tool bun --tool cargo --tool wasm-bindgen --criterion exhaustive.browser-lifecycle --artifact "target/generated/**/provenance.json" -- just plugin-browser-check
      - name: Retain exhaustive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exhaustive-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
