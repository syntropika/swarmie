name: Plugin foundation

on:
  pull_request:
    paths:
      - "crates/**"
      - "plugins/**"
      - "vendor/**"
      - "tests/fixtures/**"
      - "scripts/tembra/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "rustfmt.toml"
      - "justfile"
      - ".github/workflows/foundation.yml"
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install pinned Rust and Just
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          cargo +1.99.0 install just --version 1.58.0 --locked
      - name: Install locked workspace and published Tembra packages
        run: bun install --frozen-lockfile
      - name: Verify native libraries and actual managed lifecycle
        run: just foundation-check sdk-check
      - name: Verify root frontend policy and retained clients
        run: bun run check
      - name: Export the published browser ABI
        run: just tembra-browser
