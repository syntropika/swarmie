name: Validate public documentation

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/contracts/**"
      - "assets/brandkit/**"
      - "package.json"
      - "bun.lock"
      - "oxfmt.config.ts"
      - ".github/workflows/docs.yml"
  push:
    paths:
      - "apps/docs/**"
      - "packages/contracts/**"
      - "assets/brandkit/**"
      - "package.json"
      - "bun.lock"
      - "oxfmt.config.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install workspace tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd apps/docs test:generated
      - run: bun run --cwd apps/docs check
      - run: bun run --cwd apps/docs build
      - uses: actions/upload-artifact@v4
        with:
          name: public-documentation
          path: apps/docs/out
          if-no-files-found: error
