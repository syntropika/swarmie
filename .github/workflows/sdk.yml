name: Native SDK conformance

on:
  pull_request:
    paths:
      - "crates/client*/**"
      - "sdk/**"
      - "packages/contracts/**"
      - "scripts/client-conformance.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Verify shared native engine
        run: |
          cargo fmt -p swarmie-client -p swarmie-client-ffi -p swarmie-client-node -- --check
          cargo clippy --locked -p swarmie-client -p swarmie-client-ffi -p swarmie-client-node --all-targets -- -D warnings
          cargo test --locked -p swarmie-client -p swarmie-client-ffi
          RUSTDOCFLAGS="-D warnings" cargo doc --locked -p swarmie-client -p swarmie-client-ffi -p swarmie-client-node --no-deps --document-private-items
          cargo build --locked -p app --bin swarmie
      - name: Linux conformance
        if: runner.os == 'Linux'
        run: python3 scripts/client-conformance.py --skip-swift
      - name: macOS and Swift conformance
        if: runner.os == 'macOS'
        run: python3 scripts/client-conformance.py --swift-local
