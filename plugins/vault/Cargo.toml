[package]
name = "swarmie-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node-owned encrypted secrets, private authority and blind capture"

[features]
default = []
tools = ["dep:swarmie-tools", "swarmie-permissions/tembra", "executors"]
native-keyring = ["dep:keyring", "swarmie-cloud-account?/native-keyring"]
executors = ["dep:tokio", "dep:reqwest", "dep:nix"]
cloud-client = ["dep:swarmie-cloud-account", "swarmie-permissions/tls"]

[dependencies]
swarmie-tools = { workspace = true, optional = true }
swarmie-cloud-account = { path = "../cloud-account", optional = true }
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "macros", "sync"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"], optional = true }

tembra.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
swarmie-permissions = { path = "../permissions" }
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
rand = "=0.8.5"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
serde_jcs = "=0.1.0"
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"], optional = true }

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
hex = "0.4"
tempfile.workspace = true

[lints]
workspace = true
