[package]
name = "swarmie-conversation-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Managed conversation session composition over history, context and agent execution"

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
swarmie-tools.workspace = true
swarmie-git = { path = "../../git", features = ["tools"] }
swarmie-providers = { workspace = true, features = ["native"] }
swarmie-context = { workspace = true, features = ["durable-tasks"] }
swarmie-commands.workspace = true
swarmie-ai.workspace = true
swarmie-agent-loop = { workspace = true, features = ["conversations", "durable-tasks", "context-projection"] }
swarmie-durable-tasks.workspace = true
swarmie-conversations.workspace = true
swarmie-storage.workspace = true
sha2 = "0.10"
uuid = { workspace = true, features = ["v5"] }
tembra.workspace = true
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
tempfile.workspace = true

[lints]
workspace = true
