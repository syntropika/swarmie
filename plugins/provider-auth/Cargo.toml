[package]
name = "swarmie-provider-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["rust_crypto"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }

[dev-dependencies]
rsa = { version = "=0.9.10", features = ["pem", "sha2"] }

[lints]
workspace = true
