[package]
name = "swarmie-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
tembra = ["dep:tembra", "dep:futures"]
tools = ["tembra", "dep:swarmie-tools"]
plugin-manager = ["tembra", "dep:swarmie-plugin-manager"]

[dependencies]
tembra = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
swarmie-tools = { workspace = true, optional = true }
swarmie-plugin-manager = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
