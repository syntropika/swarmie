[package]
name = "swarmie-cloud-account"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native-keyring = ["dep:keyring"]

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
rand = "=0.8.5"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
