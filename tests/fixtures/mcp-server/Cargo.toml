[package]
name = "swarmie-fixture-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Synthetic MCP server for local-process and HTTP qualification"

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "io-std", "sync"] }
axum = "0.8"
tokio-util = "0.7"

[dev-dependencies]
swarmie-durable-tasks.workspace = true
swarmie-storage.workspace = true
futures.workspace = true
serde.workspace = true
swarmie-mcp.workspace = true
swarmie-tools.workspace = true
swarmie-agent-loop = { path = "../../../plugins/agent-loop" }
swarmie-providers = { workspace = true, features = ["mock"] }
swarmie-model-provider-genai.workspace = true
swarmie-desktop-runtime = { path = "../../../apps/desktop-client/runtime" }
tembra.workspace = true
tempfile.workspace = true

[lints]
workspace = true
