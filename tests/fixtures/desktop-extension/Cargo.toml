[package]
name = "desktop-extension-fixture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Keep this third-party example independent of the application workspace.
[workspace]

[dependencies]
mpai = { path = "../../../crates/core" }
protocol = { path = "../../../crates/protocol" }
mpai-workspace = { path = "../../../extensions/workspace" }
async-trait = "0.1"
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
