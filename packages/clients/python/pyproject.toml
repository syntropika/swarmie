[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmie-client"
version = "0.1.0"
description = "Python client for the swarmie runtime protocol"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.package-data]
swarmie_client = ["py.typed"]
