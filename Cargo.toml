[workspace]
members = [
    "apps/desktop-client/updater",
    "runtime",
    "storage",
    "storage/core",
    "plugins/providers",
    "plugins/plugin-manager",
    "plugins/tools",
    "plugins/model-provider-genai",
    "plugins/durable-tasks",
    "plugins/agent-loop",
    "plugins/conversations",
    "tests/fixtures/foundation-counter",
    "tests/fixtures/durable-documents",
    "tests/fixtures/atomic-journal",
]
exclude = ["vendor/genai-0.7.0"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
tembra = { git = "https://github.com/syntropika/tembra", rev = "94771d70bfa30a9f87bef8cfb69ff0a117d2f174" }
futures = "0.3"
futures-timer = "3"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
swarmie-tools = { path = "plugins/tools" }
swarmie-providers = { path = "plugins/providers" }
swarmie-storage = { path = "storage" }
swarmie-storage-core = { path = "storage/core" }
swarmie-conversations = { path = "plugins/conversations" }
swarmie-durable-tasks = { path = "plugins/durable-tasks" }
swarmie-plugin-manager = { path = "plugins/plugin-manager" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
genai = { path = "vendor/genai-0.7.0" }
