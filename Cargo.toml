[workspace]
members = [
    "apps/desktop-client/updater",
    "apps/desktop-client/runtime",
    "crates/runtime",
    "crates/runtime/node",
    "crates/runtime/node-host",
    "plugins/client-node",
    "crates/storage",
    "crates/storage/core",
    "plugins/providers",
    "crates/model-catalog",
    "crates/ai",
    "xtask",
    "plugins/provider-auth",
    "plugins/vault",
    "plugins/cloud-account",
    "plugins/device-linking",
    "plugins/permissions",
    "plugins/model-submission-protection",
    "plugins/plugin-manager",
    "plugins/tools",
    "plugins/mcp",
    "plugins/git",
    "plugins/model-provider-ai",
    "plugins/durable-tasks",
    "plugins/agent-loop",
    "plugins/conversations",
    "plugins/context",
    "plugins/project-context",
    "plugins/commands",
    "tests/fixtures/foundation-counter",
    "tests/fixtures/durable-documents",
    "tests/fixtures/atomic-journal",
    "tests/fixtures/mcp-server",
    "tests/fixtures/mcp-settings-host",
    "tests/fixtures/performance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
swarmie-ai = { path = "crates/ai" }
tembra = { version = "=0.2.0", features = ["hooks", "subscriptions", "views"] }
futures = "0.3"
futures-timer = "3"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
swarmie-vault = { path = "plugins/vault" }
swarmie-tools = { path = "plugins/tools" }
swarmie-mcp = { path = "plugins/mcp" }
swarmie-git = { path = "plugins/git" }
swarmie-providers = { path = "plugins/providers" }
swarmie-model-catalog = { path = "crates/model-catalog" }
swarmie-storage = { path = "crates/storage" }
swarmie-storage-core = { path = "crates/storage/core" }
swarmie-conversations = { path = "plugins/conversations" }
swarmie-context = { path = "plugins/context" }
swarmie-project-context = { path = "plugins/project-context" }
swarmie-commands = { path = "plugins/commands" }
swarmie-durable-tasks = { path = "plugins/durable-tasks" }
swarmie-plugin-manager = { path = "plugins/plugin-manager" }
swarmie-provider-auth = { path = "plugins/provider-auth" }
swarmie-model-provider-ai = { path = "plugins/model-provider-ai" }
swarmie-agent-loop = { path = "plugins/agent-loop" }
swarmie-runtime = { path = "crates/runtime" }
swarmie-client-node = { path = "plugins/client-node" }
swarmie-node = { path = "crates/runtime/node" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
