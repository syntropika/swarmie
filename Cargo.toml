[workspace]
members = ["crates/*", "extensions/*", "examples/external-harness"]
exclude = ["cloud", "docs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
swarmie = { path = "crates/core" }
process = { path = "crates/process" }
adapters = { path = "crates/adapters" }
protocol = { path = "crates/protocol" }
storage = { path = "crates/storage" }
swarmie-git = { path = "extensions/git" }
swarmie-workspace = { path = "extensions/workspace" }
swarmie-permissions = { path = "extensions/permissions" }
swarmie-resources = { path = "extensions/resources" }
