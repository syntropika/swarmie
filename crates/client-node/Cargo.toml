[package]
name = "swarmie-client-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
swarmie-client = { path = "../client" }
napi = { version = "3", features = ["napi8", "tokio_rt"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
