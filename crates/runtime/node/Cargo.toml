[package]
name = "swarmie-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
swarmie-vault-native.workspace = true
swarmie-activity.workspace = true
swarmie-projects.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
swarmie-conversation-runtime.workspace = true
swarmie-git = { path = "../../../plugins/git", features = ["tembra"] }
swarmie-tools.workspace = true
swarmie-runtime = { workspace = true, features = ["rpc"] }
swarmie-plugin-manager.workspace = true
tembra = { workspace = true, features = ["rpc"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
uuid.workspace = true
zeroize = "1"
swarmie-vault = { workspace = true, features = ["cloud-client", "executors", "native-keyring", "provider-credentials", "tools"] }
swarmie-storage = { workspace = true, features = ["sqlite"] }
swarmie-providers = { workspace = true, features = ["native"] }

swarmie-mcp.workspace = true
swarmie-context.workspace = true
swarmie-durable-tasks.workspace = true

[dev-dependencies]
swarmie-commands.workspace = true
swarmie-conversations.workspace = true
swarmie-agent-loop = { workspace = true, features = ["conversations"] }
tempfile.workspace = true

[lints]
workspace = true
