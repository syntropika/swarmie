[package]
name = "swarmie-desktop-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
swarmie-client-node.workspace = true
swarmie-git = { path = "../../../plugins/git", features = ["tembra"] }
swarmie-runtime = { workspace = true, features = ["rpc"] }
tembra.workspace = true
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
uuid.workspace = true

[dev-dependencies]
swarmie-conversations.workspace = true
swarmie-storage.workspace = true
swarmie-agent-loop = { workspace = true, features = ["conversations"] }
tempfile.workspace = true

[lints]
workspace = true
