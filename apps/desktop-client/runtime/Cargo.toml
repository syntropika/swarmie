[package]
name = "swarmie-desktop-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
swarmie-node.workspace = true
serde.workspace = true
serde_json.workspace = true
directories = "6"
zeroize = "1"

[dev-dependencies]
futures.workspace = true
tembra.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
swarmie-client-node.workspace = true
swarmie-runtime.workspace = true
swarmie-durable-tasks.workspace = true
swarmie-conversations.workspace = true
swarmie-storage.workspace = true
swarmie-model-submission-protection = { path = "../../../plugins/model-submission-protection" }
swarmie-agent-loop = { workspace = true, features = ["conversations"] }
tempfile.workspace = true

[lints]
workspace = true
