<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 624" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">The architecture of working together</title><desc id="architecture-desc">A precise axonometric composition of three rounded work surfaces. Fine construction lines, registration marks, open paths, and pastel inserts give the drawing an architectural character.</desc><style>.construction{stroke:#A5ABB2;stroke-width:.8;fill:none}.main-line{stroke:#435BD7;stroke-width:1.1;fill:none;stroke-linejoin:round;stroke-linecap:round}.stitch{stroke-dasharray:3 5}.ruler{stroke:#A5ABB2;stroke-width:.8}.figure-text{fill:#656A73}.figure-label{fill:#435BD7}text{font-family:monospace;font-size:12px;letter-spacing:.02em}@media(max-width:1199px){text{display:none}}</style>
